[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-task-quality-audit"
version = "0.1.0"
description = "Static quality auditing for AI coding task packages."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
task-quality-audit = "task_quality_audit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
